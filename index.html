<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ImmoAdv – Technische Immobilienanalyse und Finanzierungsvorbereitung</title><meta name="description" content="ImmoAdv strukturiert Immobilienanalysen, Cashflow, Finanzierung, Unterlagen und Bankgespräche für Kapitalanleger in Deutschland."><meta name="theme-color" content="#101826"><link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/routes.css"><link rel="stylesheet" href="/src/enhancement.css"><link rel="stylesheet" href="/src/responsive-web.css"></head><body><div id="app"></div><script src="/src/app.js" defer></script><script src="/src/routes.js" defer></script><script>document.addEventListener('DOMContentLoaded',()=>{const root=document.documentElement;root.classList.add('ia-ready');const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};const syncChecks=(selector,key,progressSelector)=>{const state=load(key,{});const boxes=[...document.querySelectorAll(selector)];boxes.forEach((b)=>{const id=b.dataset.doc||b.dataset.pro;if(state[id]){b.checked=true;b.closest('label')?.classList.add('done')}});const update=()=>{const s={};let n=0;boxes.forEach(b=>{const id=b.dataset.doc||b.dataset.pro;s[id]=b.checked;if(b.checked){n++;b.closest('label')?.classList.add('done')}else b.closest('label')?.classList.remove('done')});save(key,s);const count=document.querySelector(progressSelector);if(count){count.textContent=`${n} von ${boxes.length} Unterlagen abgehakt`;const bar=document.querySelector('#db');if(bar)bar.style.width=`${boxes.length?n/boxes.length*100:0}%`}};boxes.forEach(b=>b.addEventListener('change',update));update()};const bindRoutes=()=>{document.querySelectorAll('.route-q').forEach(btn=>btn.addEventListener('click',()=>{const a=btn.parentElement?.querySelector('.route-a');if(!a)return;const hidden=a.hidden;a.hidden=!hidden;btn.parentElement.classList.toggle('open',hidden)}));const search=document.querySelector('#ks');if(search){const cards=[...document.querySelectorAll('.route-accordion article')];const count=document.querySelector('#kc');search.addEventListener('input',()=>{const q=search.value.toLowerCase().trim();let n=0;cards.forEach(c=>{const hit=!q||c.dataset.search.includes(q);c.hidden=!hit;if(hit)n++});if(count)count.textContent=`${n} von ${cards.length} Einträgen`})}syncChecks('[data-doc]','immoadv-docs','#dp');syncChecks('[data-pro]','immoadv-pro','#progresstext');const print=document.querySelector('#print');print?.addEventListener('click',()=>window.print());const maps=document.querySelector('#maps'),months=document.querySelector('#months'),one=document.querySelector('#one'),two=document.querySelector('#two'),which=document.querySelector('#which');const compare=()=>{if(!maps||!months)return;const a=Math.max(0,+maps.value||0)*39,b=Math.max(0,+months.value||0)*19;if(one)one.textContent=a.toLocaleString('de-DE',{style:'currency',currency:'EUR'});if(two)two.textContent=b.toLocaleString('de-DE',{style:'currency',currency:'EUR'});if(which)which.textContent=a<b?'Bei diesen Annahmen ist der Einzelkauf günstiger.':a>b?'Bei diesen Annahmen ist Pro günstiger.':'Bei diesen Annahmen sind beide Optionen gleich teuer.'};maps?.addEventListener('input',compare);months?.addEventListener('input',compare);compare();document.querySelectorAll('.buy').forEach(btn=>btn.addEventListener('click',()=>{const toast=document.querySelector('#toast');if(toast){toast.textContent='Checkout wird vorbereitet. Stripe-Verbindung benötigt die Server-Umgebungsvariablen.';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3600)}}))};setTimeout(bindRoutes,0)});</script></body></html>
