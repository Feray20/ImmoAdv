/brand/immoadv-icon.svg","email":"support@immoadv.de","address":{"@type":"PostalAddress","streetAddress":"Georg-August-Zinn-Str. 25","postalCode":"64354","addressLocality":"Reinheim","addressCountry":"DE"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Wie ermittle ich den Gebäudeanteil am Kaufpreis?","acceptedAnswer":{"@type":"Answer","text":"Nur der Gebäudeanteil wird abgeschrieben. Er ergibt sich aus Kaufpreis minus Bodenwert. Den Bodenwert schätzen Sie mit dem Bodenrichtwert (BORIS) mal Grundstücksfläche bzw. Ihrem Miteigentumsanteil. Die Finanzverwaltung teilt nach dem Verhältnis der Verkehrswerte von Boden und Gebäude auf (BFH-Rechtsprechung); Hilfsmittel ist die „Arbeitshilfe zur Aufteilung eines Gesamtkaufpreises für ein bebautes Grundstück“ des BMF. Bodenwert = Bodenrichtwert × Grundstücksfläche (bei Eigentumswohnungen × Miteigentumsanteil). Eine Aufteilung im Kaufvertrag wird grundsätzlich anerkannt, wenn sie die realen Wertverhältnisse nicht grundlegend verfehlt (BFH, Urteil vom 16.09.2015 – IX R 12/14). In teuren Lagen ist der Bodenanteil hoch, entsprechend sinkt die AfA. Ein Gutachten eines Sachverständigen kann sich lohnen, wenn die Arbeitshilfe einen unplausibel hohen Bodenwert ergibt."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Start","item":"https://immoadv.de/"},{"@type":"ListItem","position":2,"name":"Wissen","item":"https://immoadv.de/wissen"},{"@type":"ListItem","position":3,"name":"Wie ermittle ich den Gebäudeanteil am Kaufpreis?","item":"https://immoadv.de/wissen/wie-ermittle-ich-den-gebaeudeanteil-am-kaufpreis"}]}]}</script><!--seo:end--><link rel="stylesheet" href="/src/site.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0F2C59"></head><body><script src="/src/app.js" defer><
