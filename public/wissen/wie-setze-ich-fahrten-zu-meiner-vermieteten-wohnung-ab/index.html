<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wie setze ich Fahrten zu meiner vermieteten Wohnung ab?</title><!--seo:start--><meta name="description" content="Fahrten zur Wohnung, etwa für Besichtigungen, Übergaben, Reparaturen oder Eigentümerversammlungen, setzen Sie mit 0,30 € je gefahrenem Kilometer ab …"><meta name="robots" content="index, follow, max-image-preview:large"><link rel="canonical" href="https://immoadv.de/wissen/wie-setze-ich-fahrten-zu-meiner-vermieteten-wohnung-ab"><meta property="og:type" content="website"><meta property="og:site_name" content="ImmoAdv"><meta property="og:locale" content="de_DE"><meta property="og:title" content="Wie setze ich Fahrten zu meiner vermieteten Wohnung ab?"><meta property="og:description" content="Fahrten zur Wohnung, etwa für Besichtigungen, Übergaben, Reparaturen oder Eigentümerversammlungen, setzen Sie mit 0,30 € je gefahrenem Kilometer ab …"><meta property="og:url" content="https://immoadv.de/wissen/wie-setze-ich-fahrten-zu-meiner-vermieteten-wohnung-ab"><meta property="og:image" content="https://immoadv.de/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="ImmoAdv – Immobilie als Kapitalanlage durchrechnen"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Wie setze ich Fahrten zu meiner vermieteten Wohnung ab?"><meta name="twitter:description" content="Fahrten zur Wohnung, etwa für Besichtigungen, Übergaben, Reparaturen oder Eigentümerversammlungen, setzen Sie mit 0,30 € je gefahrenem Kilometer ab …"><meta name="twitter:image" content="https://immoadv.de/og-image.png"><script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://immoadv.de/#org","name":"ImmoAdv","url":"https://immoadv.de/","logo":"https://immoadv.de/brand/immoadv-icon.svg","email":"support@immoadv.de","address":{"@type":"PostalAddress","streetAddress":"Georg-August-Zinn-Str. 25","postalCode":"64354","addressLocality":"Reinheim","addressCountry":"DE"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Wie setze ich Fahrten zu meiner vermieteten Wohnung ab?","acceptedAnswer":{"@type":"Answer","text":"Fahrten zur Wohnung, etwa für Besichtigungen, Übergaben, Reparaturen oder Eigentümerversammlungen, setzen Sie mit 0,30 € je gefahrenem Kilometer ab (Hin- und Rückweg). Notieren Sie Datum, Anlass und Kilometer. Für gelegentliche Fahrten gelten die Reisekostengrundsätze: 0,30 € je tatsächlich gefahrenem Kilometer mit dem eigenen Pkw (§ 9 Abs. 1 Satz 3 Nr. 4a EStG), alternativ tatsächliche Kosten öffentlicher Verkehrsmittel. Fährt jemand sehr häufig und regelmäßig zum Objekt (z. B. mehrmals pro Woche zur eigenen Hausverwaltung), kann das Finanzamt das Objekt als regelmäßige Tätigkeitsstätte ansehen – dann gilt nur die Entfernungspauschale. Fahrten zu Besichtigungen vor dem Kauf sind als vorab entstandene Werbungskosten absetzbar, wenn tatsächlich gekauft und vermietet wird. Nachweise: Fahrtenliste, Termine, Rechnungen."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Start","item":"https://immoadv.de/"},{"@type":"ListItem","position":2,"name":"Wissen","item":"https://immoadv.de/wissen"},{"@type":"ListItem","position":3,"name":"Wie setze ich Fahrten zu meiner vermieteten Wohnung ab?","item":"https://immoadv.de/wissen/wie-setze-ich-fahrten-zu-meiner-vermieteten-wohnung-ab"}]}]}</script><!--seo:end--><link rel="stylesheet" href="/src/site.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0F2C59"></head><body><script src="/src/app.js" defer></script><script src="/src/con
