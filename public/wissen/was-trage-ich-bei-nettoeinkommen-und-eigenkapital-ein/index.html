d/immoadv-icon.svg","email":"support@immoadv.de","address":{"@type":"PostalAddress","streetAddress":"Georg-August-Zinn-Str. 25","postalCode":"64354","addressLocality":"Reinheim","addressCountry":"DE"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Was trage ich bei Nettoeinkommen und Eigenkapital ein?","acceptedAnswer":{"@type":"Answer","text":"Nettoeinkommen ist das, was monatlich auf Ihrem Konto ankommt (bei Paaren beide zusammen), ohne Kindergeld und Einmalzahlungen. Eigenkapital ist das Geld, das Sie für den Kauf einsetzen können, ohne Ihren Notgroschen anzutasten. Nettoeinkommen: Auszahlungsbetrag der letzten Gehaltsabrechnungen; 13./14. Gehalt nur als Zwölftel, wenn vertraglich gesichert; Selbstständige: Durchschnitt des Gewinns nach Steuern der letzten zwei bis drei Jahre ÷ 12. Banken setzen Kindergeld und Elterngeld teils, Boni und Überstunden oft nur eingeschränkt an. Eigenkapital: Bankguthaben, Tagesgeld, Wertpapiere (Banken rechnen bei Aktien oft mit Abschlag), Bausparguthaben, Schenkung mit Nachweis. Nicht dazu: Notgroschen (Faustregel 3–6 Monatsausgaben), gebundene Altersvorsorge ohne Beleihungsmöglichkeit. ImmoAdv nutzt die Werte für Budget, Haushaltsrechnung und Bankreife."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Start","item":"https://immoadv.de/"},{"@type":"ListItem","position":2,"name":"Wissen","item":"https://immoadv.de/wissen"},{"@type":"ListItem","position":3,"name":"Was trage ich bei Nettoeinkommen und Eigenkapital ein?","item":"https://immoadv.de/wissen/was-trage-ich-bei-nettoeinkommen-und-eigenkapital-ein"}]}]}</script><!--seo:end--><link rel="stylesheet" href="/src/site.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0F2C59"></head><body><script src="/src/app.js" defer></s
