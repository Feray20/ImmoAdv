<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Welche Werbungskosten kann ich bei einer vermieteten Wohnung absetzen?</title><!--seo:start--><meta name="description" content="Absetzbar ist fast alles, was Sie für die Vermietung ausgeben: Schuldzinsen, Abschreibung (AfA), Hausgeld ohne die Zuführung zur Rücklage, Grundsteuer, …"><meta name="robots" content="index, follow, max-image-preview:large"><link rel="canonical" href="https://immoadv.de/wissen/welche-werbungskosten-kann-ich-bei-einer-vermieteten-wohnung-absetzen"><meta property="og:type" content="website"><meta property="og:site_name" content="ImmoAdv"><meta property="og:locale" content="de_DE"><meta property="og:title" content="Welche Werbungskosten kann ich bei einer vermieteten Wohnung absetzen?"><meta property="og:description" content="Absetzbar ist fast alles, was Sie für die Vermietung ausgeben: Schuldzinsen, Abschreibung (AfA), Hausgeld ohne die Zuführung zur Rücklage, Grundsteuer, …"><meta property="og:url" content="https://immoadv.de/wissen/welche-werbungskosten-kann-ich-bei-einer-vermieteten-wohnung-absetzen"><meta property="og:image" content="https://immoadv.de/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="ImmoAdv – Immobilie als Kapitalanlage durchrechnen"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Welche Werbungskosten kann ich bei einer vermieteten Wohnung absetzen?"><meta name="twitter:description" content="Absetzbar ist fast alles, was Sie für die Vermietung ausgeben: Schuldzinsen, Abschreibung (AfA), Hausgeld ohne die Zuführung zur Rücklage, Grundsteuer, …"><meta name="twitter:image" content="https://immoadv.de/og-image.png"><script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://immoadv.de/#org","name":"ImmoAdv","url":"https://immoadv.de/","logo":"https://immoadv.de/brand/immoadv-icon.svg","email":"support@immoadv.de","address":{"@type":"PostalAddress","streetAddress":"Georg-August-Zinn-Str. 25","postalCode":"64354","addressLocality":"Reinheim","addressCountry":"DE"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Welche Werbungskosten kann ich bei einer vermieteten Wohnung absetzen?","acceptedAnswer":{"@type":"Answer","text":"Absetzbar ist fast alles, was Sie für die Vermietung ausgeben: Schuldzinsen, Abschreibung (AfA), Hausgeld ohne die Zuführung zur Rücklage, Grundsteuer, Versicherungen, Reparaturen, Verwaltung, Fahrten zum Objekt, Steuerberatung und Kosten der Mietersuche. Nicht absetzbar sind Tilgung und Ihre eigene Arbeitszeit. Werbungskosten sind alle Aufwendungen zur Erzielung der Mieteinnahmen (§ 9 Abs. 1 EStG). Typisch sofort absetzbar: 1. Schuldzinsen und Finanzierungskosten (Zinsen, Bereitstellungszinsen, Disagio im marktüblichen Rahmen, Notar- und Grundbuchkosten für die Grundschuld, Schätzkosten der Bank). 2. AfA auf das Gebäude (nicht auf Grund und Boden), ggf. auf mitgekaufte Einbauküche (eigenes Wirtschaftsgut, meist 10 Jahre). 3. Laufende Bewirtschaftung: Hausgeld der Eigentümergemeinschaft (ohne Zuführung zur Erhaltungsrücklage), Grundsteuer, Gebäude- und Haftpflichtversicherung, Müll, Wasser, Hausstrom, Hausmeister, Verwaltergebühr. Wichtig: Die Nebenkosten-Vorauszahlungen des Mieters sind Einnahmen – die umlagefähigen Kosten selbst sind im Gegenzug Werbungskosten. 4. Erhaltungsaufwand: Reparaturen, Wartung, Schönheitsreparaturen, Austausch vorhandener Bauteile (Fenster, Heizung, Bad gleicher Standard) – Material und Handwerkerlohn, nicht Ihre eigene Arbeitszeit. 5. Verwaltung und Vermietung: Fahrten zum Objekt (0,30 € je gefahrenem Kilometer), Porto, Telefon, Kontoführung des Mietkontos, Inserate und Makler bei der Mietersuche, Mietvertragsformulare, Rechtsschutz- und Prozesskosten aus dem Mietverhältnis, Mitgliedsbeitrag Haus & Grund, Steuerberatung für die Anlage V. 6. Vorab entstandene Werbungskosten: Fahrten zu Besichtigungen, Finanzierungskosten und Leerstandskosten vor der ersten Vermietung, wenn die Vermietungsabsicht feststeht. Nicht sofort absetzbar sind Anschaffungskosten (Kaufpreis, Grunderwerbsteuer, Notar für den Kaufvertrag, Makler beim Kauf) – sie fließen über die AfA ein – und Herstellungskosten bzw. anschaffungsnahe Herstellungskosten (15-%-Grenze). Keine Werbungskosten: Tilgung, eigene Arbeitsleistung, private Nutzung, ausgefallene Miete (sie ist einfach keine Einnahme). Rechtsgrundlagen: §§ 9, 21 EStG, § 82b EStDV. Für Ihren Einzelfall: Steuerberatung."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Start","item":"https://immoadv.de/"},{"@type":"ListItem","position":2,"name":"Wissen","item":"https://immoadv.de/wissen"},{"@type":"ListItem","position":3,"name":"Welche Werbungskosten kann ich bei einer vermieteten Wohnung absetzen?","item":"https://immoadv.de/wissen/welche-werbungskosten-kann-ich-bei-einer-vermieteten-wohnung-absetzen"}]}]}</script><!--seo:end--><link rel="stylesheet" href="/src/site.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0F2C59"></head><body><script src="/src/app.js" defer></script><script src="/src/content.js" defer></script><script src="/src/routes.js" defer></script><script src="/src/menu.js" defer></script></body></html>
