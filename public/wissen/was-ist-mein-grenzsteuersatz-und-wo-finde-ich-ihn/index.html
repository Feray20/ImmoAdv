nd/immoadv-icon.svg","email":"support@immoadv.de","address":{"@type":"PostalAddress","streetAddress":"Georg-August-Zinn-Str. 25","postalCode":"64354","addressLocality":"Reinheim","addressCountry":"DE"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Was ist mein Grenzsteuersatz und wo finde ich ihn?","acceptedAnswer":{"@type":"Answer","text":"Der Grenzsteuersatz ist der Steuersatz auf den nächsten verdienten (oder abgesetzten) Euro. Er bestimmt, wie viel Steuer Sie durch Werbungskosten sparen. In Deutschland liegt er zwischen 14 % und 42 % (45 % für sehr hohe Einkommen), plus ggf. Solidaritätszuschlag und Kirchensteuer. Der Durchschnittssteuersatz (Steuer ÷ Einkommen) ist immer niedriger als der Grenzsteuersatz. Für die Wirkung von Werbungskosten zählt der Grenzsteuersatz: 1.000 € zusätzliche Werbungskosten sparen bei 35 % rund 350 € Einkommensteuer. Der Tarif steigt progressiv (§ 32a EStG); die Eckwerte werden jährlich angepasst. Bei Zusammenveranlagung gilt das Splittingverfahren. Kirchensteuer (8–9 % der Einkommensteuer) und der Solidaritätszuschlag (nur bei höheren Einkommen) erhöhen die Ersparnis leicht. ImmoAdv rechnet mit dem Satz, den Sie eintragen."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Start","item":"https://immoadv.de/"},{"@type":"ListItem","position":2,"name":"Wissen","item":"https://immoadv.de/wissen"},{"@type":"ListItem","position":3,"name":"Was ist mein Grenzsteuersatz und wo finde ich ihn?","item":"https://immoadv.de/wissen/was-ist-mein-grenzsteuersatz-und-wo-finde-ich-ihn"}]}]}</script><!--seo:end--><link rel="stylesheet" href="/src/site.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0F2C59"></head><body><script src="/src/app.js" defer></script><script src="/src/content.js" defe
