tps://immoadv.de/","logo":"https://immoadv.de/brand/immoadv-icon.svg","email":"support@immoadv.de","address":{"@type":"PostalAddress","streetAddress":"Georg-August-Zinn-Str. 25","postalCode":"64354","addressLocality":"Reinheim","addressCountry":"DE"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Was ist der Unterschied zwischen Erhaltungsaufwand und Herstellungskosten?","acceptedAnswer":{"@type":"Answer","text":"Erhaltungsaufwand erhält das Gebäude im bisherigen Zustand und ist sofort absetzbar – zum Beispiel Reparaturen oder der Austausch alter Fenster. Herstellungskosten schaffen etwas Neues oder heben den Standard deutlich an und werden nur über die AfA abgeschrieben. Erhaltungsaufwand: Ersatz vorhandener Teile in zeitgemäßer Form (Heizung, Fenster, Dach, Bad im bisherigen Standard), Instandsetzung, Wartung, Schönheitsreparaturen – sofort abziehbar; größere Beträge bei Wohngebäuden auf Antrag gleichmäßig auf 2 bis 5 Jahre verteilbar (§ 82b EStDV). Herstellungskosten (§ 255 Abs. 2 HGB): Erweiterung (Anbau, Dachausbau, zusätzliche Fläche), über den ursprünglichen Zustand hinausgehende wesentliche Verbesserung (Hebung des Standards in mindestens drei der vier zentralen Ausstattungsbereiche Heizung, Sanitär, Elektro, Fenster) – werden über die Restnutzungsdauer mit der Gebäude-AfA abgeschrieben. Sonderfall anschaffungsnahe Herstellungskosten (§ 6 Abs. 1 Nr. 1a EStG): Instandsetzungen innerhalb von drei Jahren nach dem Kauf, die netto 15 % der Gebäude-Anschaffungskosten übersteigen, werden insgesamt zu Herstellungskosten. Ausgenommen sind jährlich übliche Erhaltungsarbeiten."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Start","item":"https://immoadv.de/"},{"@type":"ListItem","position":2,"name":"Wissen","item":"https://immoadv.de/wissen"},{"@type":"ListItem","position":3,"name":"Was ist der Unterschied zwischen Erhaltungsaufwand und Herstellungskosten?","item":"https://immoadv.de/wissen/was-ist-der-unterschied-zwischen-erhaltungsaufwand-und"}]}]}</script><!--seo:end--><link rel="stylesheet" href="/src/site.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0F2C59"></head><body><script src="/src/app.js" defer></script><script src="/src/content.js" defer></script><script src="/src/routes.js" defer></script><script src="/src/menu.js" defer></script></body></html>
