Adv","url":"https://immoadv.de/","logo":"https://immoadv.de/brand/immoadv-icon.svg","email":"support@immoadv.de","address":{"@type":"PostalAddress","streetAddress":"Georg-August-Zinn-Str. 25","postalCode":"64354","addressLocality":"Reinheim","addressCountry":"DE"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Was sind nicht umlagefähige Kosten und Instandhaltung pro Monat?","acceptedAnswer":{"@type":"Answer","text":"Nicht umlagefähige Kosten zahlen Sie als Vermieter selbst, etwa Verwaltergebühr und Kontoführung der Eigentümergemeinschaft. Die Instandhaltung ist eine Rücklage für Reparaturen, typischerweise 0,80 bis 1,50 € je Quadratmeter und Monat, bei älteren Gebäuden mehr. Umlagefähig sind die Betriebskosten nach der Betriebskostenverordnung (Grundsteuer, Wasser, Müll, Hausmeister, Versicherungen …) – diese zahlt der Mieter über die Nebenkosten. Nicht umlagefähig: Verwaltung, Bankgebühren der Gemeinschaft, Instandhaltung und Instandsetzung, Zuführung zur Erhaltungsrücklage. Für die Instandhaltung im eigenen Sondereigentum (z. B. Bad, Böden) zusätzlich eine eigene Rücklage einplanen. Die Peterssche Formel und die II. Berechnungsverordnung (§ 28) liefern Anhaltswerte; ImmoAdv nutzt Ihre Angabe für den Cashflow."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Start","item":"https://immoadv.de/"},{"@type":"ListItem","position":2,"name":"Wissen","item":"https://immoadv.de/wissen"},{"@type":"ListItem","position":3,"name":"Was sind nicht umlagefähige Kosten und Instandhaltung pro Monat?","item":"https://immoadv.de/wissen/was-sind-nicht-umlagefaehige-kosten-und-instandhaltung-pro-monat"}]}]}</script><!--seo:end--><link rel="stylesheet" href="/src/site.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0F2C59"></
