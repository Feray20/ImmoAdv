tps://immoadv.de/brand/immoadv-icon.svg","email":"support@immoadv.de","address":{"@type":"PostalAddress","streetAddress":"Georg-August-Zinn-Str. 25","postalCode":"64354","addressLocality":"Reinheim","addressCountry":"DE"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Was bedeuten die Felder Sollzins, Tilgung und Zinsbindung?","acceptedAnswer":{"@type":"Answer","text":"Sollzins ist der vereinbarte Zinssatz pro Jahr, Tilgung der Prozentsatz, mit dem Sie den Kredit im ersten Jahr zurückzahlen, und Zinsbindung die Zahl der Jahre, für die der Zins fest ist. Aus Sollzins plus Tilgung ergibt sich Ihre Monatsrate. Monatsrate = Darlehen × (Sollzins + anfängliche Tilgung) ÷ 12. Der Effektivzins (aus dem ESIS-Merkblatt) enthält zusätzlich Kosten und ist für den Vergleich von Angeboten maßgeblich, für die Rate aber nicht. Die Zinsbindung bestimmt, wie lange Ihre Rate sicher ist; danach wird die Restschuld zum dann aktuellen Zins weiterfinanziert. Nach 10 Jahren ab Vollauszahlung können Sie mit 6 Monaten Frist kündigen (§ 489 Abs. 1 Nr. 2 BGB). Höhere Tilgung = schnellere Entschuldung und geringeres Anschlussrisiko."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Start","item":"https://immoadv.de/"},{"@type":"ListItem","position":2,"name":"Wissen","item":"https://immoadv.de/wissen"},{"@type":"ListItem","position":3,"name":"Was bedeuten die Felder Sollzins, Tilgung und Zinsbindung?","item":"https://immoadv.de/wissen/was-bedeuten-die-felder-sollzins-tilgung-und-zinsbindung"}]}]}</script><!--seo:end--><link rel="stylesheet" href="/src/site.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0F2C59"></head><body><script src="/src/app.js" defer></script><script src="/src/content.js" defer></script><script src="/src/routes.js
