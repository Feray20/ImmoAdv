v.de/brand/immoadv-icon.svg","email":"support@immoadv.de","address":{"@type":"PostalAddress","streetAddress":"Georg-August-Zinn-Str. 25","postalCode":"64354","addressLocality":"Reinheim","addressCountry":"DE"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Wie trage ich meine Vermietung in die Anlage V ein?","acceptedAnswer":{"@type":"Answer","text":"In die Anlage V gehören je Objekt die Einnahmen (Kaltmiete, Nebenkosten-Vorauszahlungen, Nachzahlungen) und die Werbungskosten (AfA, Schuldzinsen, Erhaltungsaufwand, sonstige Kosten). Für jedes Objekt wird eine eigene Anlage V abgegeben. Aufbau der Anlage V (Zeilennummern ändern sich von Jahr zu Jahr): Angaben zum Objekt (Lage, Anschaffung, Wohnfläche), Mieteinnahmen für Wohnungen, Umlagen (Nebenkosten-Vorauszahlungen und Nachzahlungen abzüglich Erstattungen), Werbungskosten: AfA (Bemessungsgrundlage, Satz), Schuldzinsen und Geldbeschaffungskosten, Erhaltungsaufwand (sofort bzw. verteilt nach § 82b EStDV), Grundsteuer, Hausgeld/Verwaltung, Versicherungen, sonstige Werbungskosten (Fahrten, Porto, Kontoführung, Steuerberatung). Ergänzend ggf. die Anlage V-Sonstiges und die Anlage V-FeWo. Abgabe elektronisch über ELSTER; Belege aufbewahren (in der Regel 10 Jahre). Keine Steuerberatung – im Zweifel Steuerberater oder Lohnsteuerhilfeverein (für Vermietung nur eingeschränkt zuständig) fragen."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Start","item":"https://immoadv.de/"},{"@type":"ListItem","position":2,"name":"Wissen","item":"https://immoadv.de/wissen"},{"@type":"ListItem","position":3,"name":"Wie trage ich meine Vermietung in die Anlage V ein?","item":"https://immoadv.de/wissen/wie-trage-ich-meine-vermietung-in-die-anlage-v-ein"}]}]}</script><!--seo:end--><link rel="stylesheet" href="/src/site.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="manifest" href="/manifest.webmanifest"><link r
