dv.de/brand/immoadv-icon.svg","email":"support@immoadv.de","address":{"@type":"PostalAddress","streetAddress":"Georg-August-Zinn-Str. 25","postalCode":"64354","addressLocality":"Reinheim","addressCountry":"DE"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Kann ich größere Reparaturen auf mehrere Jahre verteilen?","acceptedAnswer":{"@type":"Answer","text":"Ja. Größeren Erhaltungsaufwand an einem Wohngebäude können Sie auf Antrag gleichmäßig auf zwei bis fünf Jahre verteilen. Das lohnt sich, wenn Ihr Steuersatz in einem Jahr sonst nicht voll ausgenutzt würde. Rechtsgrundlage ist § 82b EStDV: Das Wahlrecht gilt für Gebäude im Privatvermögen, die überwiegend Wohnzwecken dienen. Verteilt wird gleichmäßig auf 2 bis 5 Jahre; wird das Gebäude während des Zeitraums verkauft oder nicht mehr vermietet, ist der Rest im Jahr der Veräußerung bzw. Nutzungsänderung abzuziehen. Sinnvoll ist die Verteilung bei hohen Einmalkosten, wenn sonst ein Verlust entstünde, der sich steuerlich nicht voll auswirkt, oder wenn in den Folgejahren ein höherer Grenzsteuersatz erwartet wird."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Start","item":"https://immoadv.de/"},{"@type":"ListItem","position":2,"name":"Wissen","item":"https://immoadv.de/wissen"},{"@type":"ListItem","position":3,"name":"Kann ich größere Reparaturen auf mehrere Jahre verteilen?","item":"https://immoadv.de/wissen/kann-ich-groessere-reparaturen-auf-mehrere-jahre-verteilen"}]}]}</script><!--seo:end--><link rel="stylesheet" href="/src/site.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0F2C59"></head><body><script src="/src/app.js" defer></script><script src="/src/content.js" defer></script><script src="/src/routes.js" defer></script><script src="/src/menu.js" de
