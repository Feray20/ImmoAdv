<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sind Schuldzinsen auch nach dem Verkauf noch absetzbar?</title><!--seo:start--><meta name="description" content="Unter Umständen ja: Reicht der Verkaufserlös nicht, um das Darlehen abzulösen, können die weiter anfallenden Zinsen als nachträgliche Werbungskosten …"><meta name="robots" content="index, follow, max-image-preview:large"><link rel="canonical" href="https://immoadv.de/wissen/sind-schuldzinsen-auch-nach-dem-verkauf-noch-absetzbar"><meta property="og:type" content="website"><meta property="og:site_name" content="ImmoAdv"><meta property="og:locale" content="de_DE"><meta property="og:title" content="Sind Schuldzinsen auch nach dem Verkauf noch absetzbar?"><meta property="og:description" content="Unter Umständen ja: Reicht der Verkaufserlös nicht, um das Darlehen abzulösen, können die weiter anfallenden Zinsen als nachträgliche Werbungskosten …"><meta property="og:url" content="https://immoadv.de/wissen/sind-schuldzinsen-auch-nach-dem-verkauf-noch-absetzbar"><meta property="og:image" content="https://immoadv.de/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="ImmoAdv – Immobilie als Kapitalanlage durchrechnen"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Sind Schuldzinsen auch nach dem Verkauf noch absetzbar?"><meta name="twitter:description" content="Unter Umständen ja: Reicht der Verkaufserlös nicht, um das Darlehen abzulösen, können die weiter anfallenden Zinsen als nachträgliche Werbungskosten …"><meta name="twitter:image" content="https://immoadv.de/og-image.png"><script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://immoadv.de/#org","name":"ImmoAdv","url":"https://immoadv.de/","logo":"https://immoadv.de/brand/immoadv-icon.svg","email":"support@immoadv.de","address":{"@type":"PostalAddress","streetAddress":"Georg-August-Zinn-Str. 25","postalCode":"64354","addressLocality":"Reinheim","addressCountry":"DE"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Sind Schuldzinsen auch nach dem Verkauf noch absetzbar?","acceptedAnswer":{"@type":"Answer","text":"Unter Umständen ja: Reicht der Verkaufserlös nicht, um das Darlehen abzulösen, können die weiter anfallenden Zinsen als nachträgliche Werbungskosten absetzbar bleiben. Vorfälligkeitsentschädigungen beim Verkauf sind dagegen in der Regel Veräußerungskosten. Nach der Rechtsprechung (BFH, Urteil vom 08.04.2014 – IX R 45/13) sind Schuldzinsen für ein Darlehen, das zur Anschaffung einer vermieteten Immobilie aufgenommen wurde, nach deren Veräußerung als nachträgliche Werbungskosten abziehbar, soweit der Veräußerungserlös nicht zur Tilgung ausreicht. Eine Vorfälligkeitsentschädigung, die wegen des Verkaufs anfällt, zählt grundsätzlich zu den Veräußerungskosten (relevant bei Verkauf innerhalb der 10-Jahres-Frist, § 23 EStG) und nicht zu den Werbungskosten aus Vermietung."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Start","item":"https://immoadv.de/"},{"@type":"ListItem","position":2,"name":"Wissen","item":"https://immoadv.de/wissen"},{"@type":"ListItem","position":3,"name":"Sind Schuldzinsen auch nach dem Verkauf noch absetzbar?","item":"https://immoadv.de/wissen/sind-schuldzinsen-auch-nach-dem-verkauf-noch-absetzbar"}]}]}</script><!--seo:end--><link rel="stylesheet" href="/src/site.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0F2C59"></head><body><script src="/src/app.js" defer></script><script src="/src/content.js" defer></script><script src="/src/routes.j
