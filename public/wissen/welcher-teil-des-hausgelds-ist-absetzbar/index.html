adv.de","address":{"@type":"PostalAddress","streetAddress":"Georg-August-Zinn-Str. 25","postalCode":"64354","addressLocality":"Reinheim","addressCountry":"DE"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Welcher Teil des Hausgelds ist absetzbar?","acceptedAnswer":{"@type":"Answer","text":"Absetzbar ist das Hausgeld ohne den Anteil, der in die Erhaltungsrücklage fließt. Die umlagefähigen Kosten setzen Sie ab und geben im Gegenzug die Nebenkosten-Vorauszahlungen des Mieters als Einnahme an. Das Hausgeld setzt sich zusammen aus umlagefähigen Betriebskosten (z. B. Wasser, Müll, Hausmeister, Versicherung – Betriebskostenverordnung), nicht umlagefähigen Kosten (z. B. Verwaltergebühr, Kontoführung der Gemeinschaft, Instandhaltung) und der Zuführung zur Erhaltungsrücklage. Werbungskosten sind die umlagefähigen und nicht umlagefähigen Kosten. Die Zuführung zur Rücklage ist erst absetzbar, wenn die Gemeinschaft das Geld für Erhaltung ausgibt (BFH IX R 19/21) – dann Ihr Anteil laut Jahresabrechnung. Einnahmen: Kaltmiete plus Nebenkosten-Vorauszahlungen des Mieters, abzüglich Erstattungen bzw. zuzüglich Nachzahlungen aus der Nebenkostenabrechnung."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Start","item":"https://immoadv.de/"},{"@type":"ListItem","position":2,"name":"Wissen","item":"https://immoadv.de/wissen"},{"@type":"ListItem","position":3,"name":"Welcher Teil des Hausgelds ist absetzbar?","item":"https://immoadv.de/wissen/welcher-teil-des-hausgelds-ist-absetzbar"}]}]}</script><!--seo:end--><link rel="stylesheet" href="/src/site.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0F2C59"></head><body><script src="/src/app.js" defer></script><script src="/src/content.js" defer></script><script src="/src/routes.
