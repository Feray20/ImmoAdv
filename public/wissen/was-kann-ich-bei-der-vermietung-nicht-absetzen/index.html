oadv-icon.svg","email":"support@immoadv.de","address":{"@type":"PostalAddress","streetAddress":"Georg-August-Zinn-Str. 25","postalCode":"64354","addressLocality":"Reinheim","addressCountry":"DE"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Was kann ich bei der Vermietung nicht absetzen?","acceptedAnswer":{"@type":"Answer","text":"Nicht absetzbar sind die Tilgung, der Kaufpreis von Grund und Boden, die Zuführung zur Erhaltungsrücklage (erst wenn das Geld ausgegeben wird), Ihre eigene Arbeitszeit und alles Private. Anschaffungsnebenkosten wirken nur über die Abschreibung. Tilgung ist Rückzahlung eines Kredits, kein Aufwand. Grund und Boden nutzt sich nicht ab und wird nicht abgeschrieben. Grunderwerbsteuer, Notar und Grundbuch für den Eigentumserwerb sowie Makler beim Kauf sind Anschaffungsnebenkosten: Sie erhöhen die Anschaffungskosten und werden – soweit sie auf das Gebäude entfallen – über die AfA abgesetzt. Zahlungen in die Erhaltungsrücklage der Eigentümergemeinschaft sind nach der Rechtsprechung des Bundesfinanzhofs (BFH, Urteil vom 20.09.2022 – IX R 19/21) erst abziehbar, wenn die Gemeinschaft das Geld für Erhaltungsmaßnahmen ausgibt; maßgeblich ist die Jahresabrechnung. Eigene Arbeitsleistung ist nicht absetzbar, nur Material und fremde Leistungen. Bei teilweiser Eigennutzung (z. B. eine Wohnung im selbst bewohnten Haus) werden gemeinsame Kosten anteilig aufgeteilt. Mietausfall ist kein Werbungskostenabzug, sondern fehlende Einnahme. Strafen und Bußgelder sind nicht abziehbar. Bei Vermietung unter 50 % der ortsüblichen Miete sind Werbungskosten nur anteilig absetzbar (§ 21 Abs. 2 EStG)."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Start","item":"https://immoadv.de/"},{"@type":"ListItem","position":2,"name":"Wissen","item":"https://immoadv.de/wissen"},{"@type":"ListItem","position":3,"name":"Was kann ich bei der Vermietung nicht absetzen?","item":"https://immoadv.de/wissen/was-kann-ich-bei-der-vermietung-nicht-absetzen"}]}]}</script><!--seo:end--><link rel="stylesheet" href="/src/site.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0F2C59"></head><body><script src="/src/app.js" defer></script><script src="/src/content.js" defer></script><script src="/src/routes.js" defer></script><script src="/src/menu.js" defer></script></body></html>
