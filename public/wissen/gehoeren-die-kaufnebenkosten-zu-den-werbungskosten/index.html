tps://immoadv.de/brand/immoadv-icon.svg","email":"support@immoadv.de","address":{"@type":"PostalAddress","streetAddress":"Georg-August-Zinn-Str. 25","postalCode":"64354","addressLocality":"Reinheim","addressCountry":"DE"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Gehören die Kaufnebenkosten zu den Werbungskosten?","acceptedAnswer":{"@type":"Answer","text":"Nur teilweise. Grunderwerbsteuer, Notar und Grundbuch für den Kaufvertrag und der Makler beim Kauf zählen zu den Anschaffungskosten und werden über die AfA abgeschrieben. Notar und Grundbuch für die Grundschuld sowie Bankgebühren sind Finanzierungskosten und sofort absetzbar. Anschaffungskosten (§ 255 Abs. 1 HGB entsprechend): Kaufpreis plus Anschaffungsnebenkosten – Grunderwerbsteuer, Notar für Beurkundung des Kaufvertrags und Vollzug, Grundbuchamt für Auflassungsvormerkung und Eigentumsumschreibung, Maklerprovision. Sie werden nach dem Verhältnis von Gebäude zu Grund und Boden aufgeteilt; nur der Gebäudeanteil geht in die AfA-Bemessungsgrundlage. Finanzierungskosten: Notar und Grundbuch für die Bestellung der Grundschuld, Bewertungs- oder Schätzgebühren der Bank, Bereitstellungszinsen, Disagio im marktüblichen Rahmen (bis 5 % bei mindestens 5 Jahren Zinsbindung, § 11 Abs. 2 EStG) – diese sind im Jahr der Zahlung als Werbungskosten absetzbar. Mitgekauftes Inventar (z. B. Einbauküche) wird gesondert erfasst: kein Grunderwerbsteuer-Anteil und eigene AfA (Einbauküche in der Regel 10 Jahre)."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Start","item":"https://immoadv.de/"},{"@type":"ListItem","position":2,"name":"Wissen","item":"https://immoadv.de/wissen"},{"@type":"ListItem","position":3,"name":"Gehören die Kaufnebenkosten zu den Werbungskosten?","item":"https://immoadv.de/wissen/gehoeren-die-kaufnebenkosten-zu-den-werbungskosten"}]}]}</script><!--seo:end--><link rel="stylesheet" href="/src/site.css"><link rel="icon" href="/favicon.svg" type="image/svg
